name: Build
on:
  push:
    branches:
      - main
    paths:
      - custom-*.json
      - main.go
      - sources.go
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate custom rule sets
        run: go test ./...
      - name: Build rule-set
        run: |
          go run -v .
      - name: Push to release branch
        run: .github/release-rule-set.sh release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
