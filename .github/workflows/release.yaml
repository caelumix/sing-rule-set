name: Update rule-set
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate custom rule sets
        run: go test ./...
      - name: Build rule-set
        run: |
          go run -v .
      - name: Push to rule-set branch
        run: .github/release-rule-set.sh release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
